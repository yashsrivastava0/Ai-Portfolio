<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPrev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgPrev)" rx="16" />

  <!-- Browser Window Wrapper -->
  <g transform="translate(40, 40)">
    <!-- Shadow & Frame -->
    <rect width="720" height="520" rx="14" fill="#0D111E" stroke="#00D2FF" stroke-width="2" />
    
    <!-- Top Bar -->
    <rect width="720" height="38" rx="14" fill="#141B2D" />
    <circle cx="24" cy="19" r="6" fill="#EF4444" />
    <circle cx="44" cy="19" r="6" fill="#F59E0B" />
    <circle cx="64" cy="19" r="6" fill="#10B981" />
    <!-- URL Bar -->
    <rect x="180" y="8" width="360" height="22" rx="11" fill="#1F293D" />
    <text x="360" y="23" font-family="monospace" font-size="11" fill="#94A3B8" text-anchor="middle">https://app.oryxenai.me/preview/live</text>

    <!-- Verification Badge Top Right -->
    <g transform="translate(565, 8)">
      <rect width="135" height="22" rx="11" fill="#064E3B" stroke="#10B981" stroke-width="1" />
      <circle cx="16" cy="11" r="4" fill="#10B981" />
      <text x="28" y="15" font-family="monospace" font-size="10" font-weight="700" fill="#34D399">PLAYWRIGHT PASS</text>
    </g>

    <!-- Webpage Content Inside Browser -->
    <g transform="translate(30, 60)">
      <!-- Mini Hero Section -->
      <rect width="660" height="150" rx="10" fill="#161F33" stroke="#25324D" stroke-width="1" />
      <text x="30" y="45" font-family="system-ui, sans-serif" font-weight="800" font-size="28" fill="#FAF8F5">ALEX CHEN — ML ARCHITECT</text>
      <text x="30" y="75" font-family="monospace" font-size="13" fill="#38BDF8">Reinforcement Learning • Distributed Training • PyTorch</text>
      <text x="30" y="105" font-family="sans-serif" font-size="12" fill="#94A3B8">Engineered high-throughput training pipelines for foundation models at scale.</text>

      <!-- CTA Buttons -->
      <rect x="30" y="118" width="100" height="22" rx="6" fill="#00D2FF" />
      <text x="44" y="133" font-family="sans-serif" font-weight="700" font-size="10" fill="#0B0F19">VIEW PROJECTS</text>
      <rect x="140" y="118" width="100" height="22" rx="6" fill="#1F293D" stroke="#334155" stroke-width="1" />
      <text x="160" y="133" font-family="sans-serif" font-weight="600" font-size="10" fill="#E2E8F0">GET IN TOUCH</text>

      <!-- 3 Work Cards -->
      <g transform="translate(0, 170)">
        <!-- Card 1 -->
        <g transform="translate(0, 0)">
          <rect width="206" height="180" rx="10" fill="#161F33" stroke="#25324D" stroke-width="1" />
          <rect x="12" y="12" width="182" height="95" rx="6" fill="#1F293D" />
          <text x="16" y="130" font-family="sans-serif" font-weight="700" font-size="14" fill="#FAF8F5">FlashAttention-X</text>
          <text x="16" y="148" font-family="sans-serif" font-size="11" fill="#94A3B8">Kernel optimization in CUDA</text>
          <text x="16" y="165" font-family="monospace" font-size="9" fill="#00D2FF">GPU / PyTorch</text>
        </g>

        <!-- Card 2 -->
        <g transform="translate(226, 0)">
          <rect width="206" height="180" rx="10" fill="#161F33" stroke="#25324D" stroke-width="1" />
          <rect x="12" y="12" width="182" height="95" rx="6" fill="#1F293D" />
          <text x="16" y="130" font-family="sans-serif" font-weight="700" font-size="14" fill="#FAF8F5">DistributedRL</text>
          <text x="16" y="148" font-family="sans-serif" font-size="11" fill="#94A3B8">Actor-critic scaling across 64 nodes</text>
          <text x="16" y="165" font-family="monospace" font-size="9" fill="#00D2FF">Ray / Python</text>
        </g>

        <!-- Card 3 -->
        <g transform="translate(454, 0)">
          <rect width="206" height="180" rx="10" fill="#161F33" stroke="#25324D" stroke-width="1" />
          <rect x="12" y="12" width="182" height="95" rx="6" fill="#1F293D" />
          <text x="16" y="130" font-family="sans-serif" font-weight="700" font-size="14" fill="#FAF8F5">ModelObservability</text>
          <text x="16" y="148" font-family="sans-serif" font-size="11" fill="#94A3B8">Real-time drift detection dashboard</text>
          <text x="16" y="165" font-family="monospace" font-size="9" fill="#00D2FF">FastAPI / Next.js</text>
        </g>
      </g>
    </g>
  </g>
</svg>
